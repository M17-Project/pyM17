name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: pytest

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check src tests tools
      - run: ruff format --check src tests tools

  vectors:
    name: Test vectors match libm17 and gr-m17
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: M17-Project/libm17
          path: libm17
      - uses: actions/checkout@v4
        with:
          repository: M17-Project/gr-m17
          path: gr-m17
          submodules: recursive
      - name: Regenerate and compare
        run: |
          cc -O2 -Ilibm17 tools/gen_vectors.c libm17/m17.c $(ls libm17/*/*.c | grep -v unit_tests) -o gen_vectors -lm
          ./gen_vectors > tests/vectors.json
          G=gr-m17
          cc -O2 -w -I$G/tinier-aes -I$G/micro-ecc tools/gen_crypto_vectors.c $G/tinier-aes/aes.c $G/micro-ecc/uECC.c -o gen_crypto_vectors
          ./gen_crypto_vectors > tests/crypto_vectors.json
          git diff --exit-code tests/
